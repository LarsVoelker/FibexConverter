[project]
name = "FibexConverter"
version = "0.1.0"
description = "A tool to work with FIBEX files and generate different representations as well as Wireshark Configs."
license = "GPL-2.0-or-later"
readme = "README.md"
requires-python = ">=3.12, <3.14"
maintainers = [
    { name = "Dr. Lars Völker", email = "lars.voelker@technica-engineering.de" },
]
dependencies = [
    "graphviz>=0.21",
    "isodate>=0.7.2",
    "lxml>=6.1.1",
    "macaddress>=2.0.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "xlsxwriter>=3.2.9",
    "flync==0.13.0",
]

[tool.black]
line-length = 149

[tool.isort]
profile = "black"
line_length = 149

[tool.pytest]
addopts = ["-n", "auto", "--cov=.", "--cov-report=html"]
testpaths = ["tests"]
